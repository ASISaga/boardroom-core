[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "boardroom-core"
version = "0.1.0"
description = "Wire contracts (Envelope, Evt, Digest) shared by Boardroom's Function app (F) and Foundry orchestration container (O)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"

# Pinned per .github/specs/10-dependency-lock.md.
dependencies = [
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/ASISaga/boardroom"
Repository = "https://github.com/ASISaga/boardroom"

[tool.hatch.build.targets.wheel]
packages = ["src/boardroom_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/boardroom_core",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
